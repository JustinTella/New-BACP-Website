<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // SPA fallback for GitHub Pages: when a visitor lands on a deep route
      // (e.g. /about, /resources/careers) via a direct URL or a refresh,
      // GitHub serves this 404 page instead of index.html. We stash the
      // requested route in sessionStorage and bounce to the site root, where
      // App.tsx picks it up and restores the URL before the router mounts.
      (function () {
        var loc = window.location;
        var segments = loc.pathname.split("/").filter(Boolean);
        // On a project Pages site (user.github.io/repo/...) the first segment
        // is the repo name and belongs to the base path, not the route. On a
        // custom domain the site is served from the root, so there is no
        // such prefix to strip.
        var isProjectPages = /\.github\.io$/i.test(loc.hostname) && segments.length > 0;
        var base = isProjectPages ? "/" + segments[0] + "/" : "/";
        var route = (isProjectPages ? segments.slice(1) : segments).join("/");
        sessionStorage.setItem("spa-redirect", route + loc.search + loc.hash);
        loc.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
